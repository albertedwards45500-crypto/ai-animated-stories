# 开发基础设施（可选）：本机已安装 MySQL/Redis 时无需启动此文件。
# 若启动，请先停用本机 MySQL/Redis 服务或修改端口映射，避免 3306/6379 冲突。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: change_me_dev
      MYSQL_DATABASE: ai_drama
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  mysql_data:
